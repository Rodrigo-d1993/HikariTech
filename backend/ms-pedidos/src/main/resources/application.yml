server:
  port: 8082

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ─── Base de datos ──────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pedidos360_pedidos}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  # ─── Security / JWT ─────────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:}

  # ─── JavaMailSender (SMTP) ───────────────────────────────────────────────────
  # Desarrollo: Gmail con contraseña de aplicación (variable MAIL_PASSWORD).
  # Producción: cambiar host/port/username a las credenciales de AWS SES
  #             sin modificar el código Java.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:gamehikari.tech@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ─── Propiedades propias de ms-pedidos ────────────────────────────────────────
app:
  productos-service-url: ${PRODUCTOS_SERVICE_URL:http://localhost:8081}

  # ─── Email (JavaMailSender) ────────────────────────────────────────────────
  # En desarrollo se usa Gmail SMTP con contraseña de aplicación.
  # En producción reemplazar por AWS SES u otro proveedor cambiando
  # solo las variables de entorno, sin tocar el código.
  mail:
    from: ${MAIL_FROM:gamehikari.tech@gmail.com}

  rabbit:
    exchanges:
      pedidos: pedidos.exchange
    queues:
      notificacion:     pedidos.notificacion
      auditoria:        pedidos.auditoria
      notificacion-dlq: pedidos.notificacion.dlq
      auditoria-dlq:    pedidos.auditoria.dlq
    routing-keys:
      pedido-creado: pedido.creado
      pedido-estado: pedido.estado
    dlx: pedidos.dlx
