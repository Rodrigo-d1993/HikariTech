## ─────────────────────────────────────────────────────────────────────────────
## Clúster RabbitMQ de 2 nodos – Pedidos360
## Uso en EC2 / local:
##   1. Crear archivo .env con RABBITMQ_ERLANG_COOKIE, RABBITMQ_USER, RABBITMQ_PASSWORD
##   2. docker compose -f docker-compose.cluster.yml up -d
##   3. Esperar ~15s y luego unir nodos:
##        docker exec rabbit2 rabbitmqctl stop_app
##        docker exec rabbit2 rabbitmqctl reset
##        docker exec rabbit2 rabbitmqctl join_cluster rabbit@rabbit1
##        docker exec rabbit2 rabbitmqctl start_app
##   4. Verificar:
##        docker exec rabbit1 rabbitmqctl cluster_status
## ─────────────────────────────────────────────────────────────────────────────

services:

  rabbit1:
    image: rabbitmq:4-management
    hostname: rabbit1
    container_name: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP nodo 1
      - "15672:15672"  # Management UI nodo 1 → http://localhost:15672
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  rabbit2:
    image: rabbitmq:4-management
    hostname: rabbit2
    container_name: rabbit2
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"    # AMQP nodo 2
      - "15673:15672"  # Management UI nodo 2 → http://localhost:15673
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
    depends_on:
      rabbit1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbit1_data:
  rabbit2_data:
